<form class="{{cssClass}} flexcol" autocomplete="off">
    <header class="sheet-header">
        <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" />
        <div class="header-fields">
            <h1 class="charname">
                <input name="name" type="text" value="{{item.name}}" placeholder="Weapon Name"/>
            </h1>
        </div>
    </header>

    <div class="sheet-body">
        <!-- Basic Information Section -->
        <div class="form-group">
            <h3>Basic Information</h3>
            <div class="form-row">
                <div class="form-field checkbox-field">
                    <label>
                        <input type="checkbox" name="system.isRanged" {{checked system.isRanged}}/>
                        Ranged Weapon
                    </label>
                </div>
                <div class="form-field">
                    <label>Group</label>
                    <select name="system.group">
                        <option value="Ordinary" {{#if (eq system.group "Ordinary")}}selected{{/if}}>Ordinary</option>
                        <option value="Cavalry" {{#if (eq system.group "Cavalry")}}selected{{/if}}>Cavalry</option>
                        <option value="Crossbow" {{#if (eq system.group "Crossbow")}}selected{{/if}}>Crossbow</option>
                        <option value="Engineer" {{#if (eq system.group "Engineer")}}selected{{/if}}>Engineer</option>
                        <option value="Entangling" {{#if (eq system.group "Entangling")}}selected{{/if}}>Entangling</option>
                        <option value="Flail" {{#if (eq system.group "Flail")}}selected{{/if}}>Flail</option>
                        <option value="Gunpowder" {{#if (eq system.group "Gunpowder")}}selected{{/if}}>Gunpowder</option>
                        <option value="Longbow" {{#if (eq system.group "Longbow")}}selected{{/if}}>Longbow</option>
                        <option value="Parrying" {{#if (eq system.group "Parrying")}}selected{{/if}}>Parrying</option>
                        <option value="Sling" {{#if (eq system.group "Sling")}}selected{{/if}}>Sling</option>
                        <option value="Throwing" {{#if (eq system.group "Throwing")}}selected{{/if}}>Throwing</option>
                        <option value="Two-handed" {{#if (eq system.group "Two-handed")}}selected{{/if}}>Two-handed</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Availability</label>
                    <select name="system.availability">
                        <option value="Abundant" {{#if (eq system.availability "Abundant")}}selected{{/if}}>Abundant</option>
                        <option value="Plentiful" {{#if (eq system.availability "Plentiful")}}selected{{/if}}>Plentiful</option>
                        <option value="Common" {{#if (eq system.availability "Common")}}selected{{/if}}>Common</option>
                        <option value="Average" {{#if (eq system.availability "Average")}}selected{{/if}}>Average</option>
                        <option value="Scarce" {{#if (eq system.availability "Scarce")}}selected{{/if}}>Scarce</option>
                        <option value="Rare" {{#if (eq system.availability "Rare")}}selected{{/if}}>Rare</option>
                        <option value="Very Rare" {{#if (eq system.availability "Very Rare")}}selected{{/if}}>Very Rare</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Craftsmanship</label>
                    <select name="system.craftsmanship">
                        <option value="Poor" {{#if (eq system.craftsmanship "Poor")}}selected{{/if}}>Poor</option>
                        <option value="Common" {{#if (eq system.craftsmanship "Common")}}selected{{/if}}>Common</option>
                        <option value="Good" {{#if (eq system.craftsmanship "Good")}}selected{{/if}}>Good</option>
                        <option value="Best" {{#if (eq system.craftsmanship "Best")}}selected{{/if}}>Best</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>Cost (gc)</label>
                    <input type="number" name="system.cost" value="{{system.cost}}" min="0" data-dtype="Number"/>
                </div>
                <div class="form-field">
                    <label>Encumbrance</label>
                    <input type="number" name="system.encumbrance" value="{{system.encumbrance}}" min="0" data-dtype="Number"/>
                </div>
            </div>
        </div>

        <!-- Combat Statistics Section -->
        <div class="form-group">
            <h3>Combat Statistics</h3>
            <div class="form-row">
                <div class="form-field">
                    <label>Damage</label>
                    <input type="number" name="system.damage" value="{{system.damage}}" min="0" data-dtype="Number"/>
                </div>
                <div class="form-field">
                    <label>Range (yards)</label>
                    <input type="number" name="system.range" value="{{system.range}}" min="0" data-dtype="Number" placeholder="0 for melee"/>
                </div>
                <div class="form-field">
                    <label>Reload</label>
                    <input type="text" name="system.reload" value="{{system.reload}}" placeholder=""/>
                </div>
            </div>
        </div>

        <!-- Weapon Properties Section -->
        <div class="form-group">
            <h3>Weapon Properties</h3>
            <div class="form-row">
                <div class="form-field checkbox-field">
                    <label>
                        <input type="checkbox" name="system.hasImpact" {{checked system.hasImpact}}/>
                        Impact
                    </label>
                </div>
                <div class="form-field checkbox-field">
                    <label>
                        <input type="checkbox" name="system.hasDefensive" {{checked system.hasDefensive}}/>
                        Defensive
                    </label>
                </div>
            </div>
            <div class="form-field">
                <label>Qualities</label>
                <textarea name="system.qualities" rows="1" placeholder="">{{system.qualities}}</textarea>
            </div>
        </div>

        <!-- Description Section -->
        <div class="form-group">
            <h3>Description & Notes</h3>
            <textarea name="system.description" rows="2" placeholder="Add notes and description about this weapon...">{{system.description}}</textarea>
